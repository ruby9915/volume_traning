<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f3" />
    <meta name="color-scheme" content="light dark" />
    <title>볼륨 트래커</title>
    <!-- 첫 페인트 전 테마 클래스 선적용 — 깜빡임(FOUC) 방지. src/theme.ts와 키·로직 동기화 유지 -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("vt_theme"); // "light" | "dark" | 그 외 = system
          var dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#0c0b0a");
          }
        } catch (e) {
          /* localStorage 접근 불가 시 라이트 기본 */
        }
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/oswald-latin-400-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-400-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
